[package]
name = "mouse-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Clipboard sync for mouse-rs"

[dependencies]
mouse-core = { path = "../mouse-core" }
tracing.workspace = true
# Only the lock-free sender: the sync thread pushes clipboard messages straight to
# the link with no runtime.
tokio = { version = "1.40", default-features = false, features = ["sync"] }
# Cross-platform clipboard (X11 on Linux, Win32 on Windows). default-features=false
# drops the image-data (image crate) and wayland features — text-only for now.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# PNG codec for clipboard images: pure Rust, MIT/Apache-2.0 (no GPL in the tree).
png = "0.17"
base64 = "0.22"
# Content addressing for the blob cache. Already in the workspace (used by the auth
# HMAC), so this adds no new dependency to audit or license.
sha2.workspace = true
# File metadata crosses the link as JSON on the input lane.
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# CF_HDROP: arboard cannot do file lists at all. BSL-1.0 — permissive, fine to ship.
clipboard-win = "5"
# Virtual files on the clipboard (CFSTR_FILEDESCRIPTOR + CFSTR_FILECONTENTS): Explorer pulls
# the bytes of a file still on the peer through an IStream and writes them straight where
# the user pasted, with its own progress dialog. Needs COM objects implemented in Rust,
# which is what this crate's `implement` macro is for. MIT OR Apache-2.0.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
# Owning the X11 CLIPBOARD selection to serve file targets. Already a workspace dep.
x11rb.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Presents files still arriving from the peer as an ordinary folder, so a paste starts at
# once and the file manager shows its own progress while the bytes stream in. MIT. Built
# without libfuse: it mounts through the system's setuid `fusermount3`.
fuser = { version = "0.18", default-features = false }
