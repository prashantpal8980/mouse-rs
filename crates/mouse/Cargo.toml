[package]
name = "mouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "mouse-rs: a fast, Barrier-like KVM software switch"

[[bin]]
name = "mouse-rs"
path = "src/main.rs"

[features]
default = ["gui"]
# The iced control panel + system tray. Off → a slim headless binary
# (`--no-default-features`) that only does `server`/`client`.
gui = ["dep:iced", "dep:tray-icon", "dep:gtk", "dep:windows-sys", "dep:rand"]

[dependencies]
mouse-core = { path = "../mouse-core" }
mouse-input = { path = "../mouse-input" }
mouse-engine = { path = "../mouse-engine" }
mouse-clipboard = { path = "../mouse-clipboard" }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
# Update notice (R36): checking the signed release description and the download.
sha2.workspace = true
ring = "0.17"
# The release check over HTTPS (MIT/Apache). rustls on ring like the rest of the
# project, with the public CA roots built in so it works the same on every machine.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# GUI: iced 0.14 (MIT). Default features give the wgpu renderer with a tiny-skia
# software fallback (runs on GPU-less machines / VMs / RDP), and winit windowing
# with x11+wayland on Linux. Verified to cross-compile cleanly to windows-gnu.
# `tokio` backend enables `iced::time::every` for the live-status poll (the project
# already uses tokio; iced's UI runtime is independent of the engine's).
iced = { version = "0.14", features = ["tokio"], optional = true }
# System tray (re-exports `muda` as `tray_icon::menu`, so no separate menu dep).
tray-icon = { version = "0.24", optional = true }
# Random secret generation for the GUI's "Generate" button.
rand = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `geteuid`, to refuse the greeter setup commands before they half-apply, and to set
# 0700 on the directory holding the root-owned copy of the shared secret.
libc.workspace = true

[target.'cfg(unix)'.dependencies]
# tray-icon on Linux needs gtk initialised with a running gtk main loop (its own
# thread — see src/tray.rs). Version pinned to what tray-icon/libappindicator use.
gtk = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
# Just `FreeConsole`, to drop the console window when launching the GUI (the binary
# stays a console app so `server`/`client` keep foreground logs + Ctrl-C).
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry",
    # ShellExecuteW with the "runas" verb: the only way to ask Windows for elevation,
    # which it grants through its own consent prompt rather than to us directly.
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation",
    # Waiting for that elevated helper to finish (Start at login as administrator).
    "Win32_System_Threading"], optional = true }
