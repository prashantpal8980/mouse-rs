# Build and test mouse-rs on every push, and produce the Linux and Windows binaries.
#
# Builds made here are the ones SignPath Foundation can sign: it signs only binaries
# built by CI from this repository, never files uploaded by hand. The signing step at
# the end stays off until the project is approved and the SIGNPATH_API_TOKEN secret is
# set (Settings > Secrets and variables > Actions). See docs/CODE-SIGNING.md.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      # Empty until SignPath approves the project; the signing step checks it.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            mingw-w64

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --quiet

      - name: Build Linux
        run: cargo build --release -p mouse

      - name: Build Windows
        run: cargo build --release -p mouse --target x86_64-pc-windows-gnu

      - name: Collect
        run: |
          mkdir -p out
          cp target/release/mouse-rs out/
          cp target/x86_64-pc-windows-gnu/release/mouse-rs.exe out/
          cp LICENSE NOTICE out/
          (cd out && sha256sum mouse-rs mouse-rs.exe > SHA256SUMS)

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: mouse-rs-linux-x86_64
          path: |
            out/mouse-rs
            out/LICENSE
            out/NOTICE

      - name: Upload Windows build
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: mouse-rs-windows-x86_64
          path: |
            out/mouse-rs.exe
            out/LICENSE
            out/NOTICE

      # Off until SignPath Foundation approves the project and the token is set.
      - name: Sign the Windows build (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mouse-rs
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
